set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on

#set panes starting to index one
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

#shift alt nvim window rotate
bind -n M-H previous-window
bind -n M-L next-window

#set vi-mode
set-window-option -g mode-keys vi
#binds
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Centered live Alacritty opacity slider; exits and closes with q.
bind o display-popup -E -w 64 -h 11 -x C -y C -s "fg=#F2FDFF,bg=#064957" -S "fg=#6DE8F5,bg=#064957" "$HOME/.config/fish/personal_functions/alacritty-opacity-popup"
bind O display-popup -E -w 64 -h 11 -x C -y C -s "fg=#F2FDFF,bg=#064957" -S "fg=#6DE8F5,bg=#064957" "$HOME/.config/fish/personal_functions/alacritty-opacity-popup"

# Frutiger Aero glass treatment: default status background preserves Alacritty translucency.
set -g status-style "bg=default,fg=#A8F7FF"
set -g status-left ""
set -g status-interval 1
set -g status-right "#[fg=#043B59,bg=#9CFFC3,bold]#{?client_prefix, PREFIX ,}#[default]#[fg=#9CFFC3]#($HOME/.config/tmux/aero-git.sh \"#{pane_current_path}\") #[fg=#6DE8F5]#($HOME/.config/tmux/aero-fish.sh)#[fg=#A8F7FF] %a %b %d #[fg=#6DE8F5,bold] %H:%M "
set -g status-left-length 0
set -g status-right-length 48
set -g window-status-separator " "
set -g window-status-format "#[fg=#78CCFF] #W "
set -g window-status-current-format "#[fg=#043B59,bg=#6DE8F5,bold] #W "
set -g pane-border-lines single
set -g pane-border-style "fg=#24718F"
set -g pane-active-border-style "fg=#7DEBFF"
set -g message-style "bg=#15557A,fg=#FFFFFF,bold"
set -g mode-style "bg=#66E6A0,fg=#06233A,bold"
set -g display-panes-colour "#FFE36E"
set -g display-panes-active-colour "#66E6A0"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

# Restore the latest saved layout on server startup; save every 15 minutes.
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

  

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'



