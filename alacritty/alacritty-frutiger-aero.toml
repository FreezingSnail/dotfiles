# Explicit Frutiger Aero entry point; normal Alacritty launches use Aero too.
import = [
  "~/.config/alacritty/alacritty.toml",
  "~/.config/alacritty/frutiger_aero.toml",
]

[window]
opacity = 0.55
blur = true
decorations = "Transparent"
dynamic_padding = true

[[keyboard.bindings]]
key = "F"
mods = "Command|Shift"
action = "ToggleFullscreen"
